server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Service worker, its manifest and the HTML shell must always be checked
    # with the server, so a new version reaches installed apps straight away.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~ ^/workbox-.*\.js$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Hashed build files never change, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback (the host nginx sends /api to the backend).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
